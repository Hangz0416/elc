<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 基于多模态图像融合的三维重建与智能感知一体化系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Microsoft YaHei', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
        }

        .container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* 左侧内容区域 */
        .left-section {
            flex: 0 0 55%;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #ffffff;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 80px;
        }

        .logo-dot {
            width: 8px;
            height: 8px;
            background: #0066ff;
            border-radius: 50%;
        }

        .logo-text {
            font-size: 16px;
            color: #666;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .main-title {
            font-size: 48px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.3;
            margin-bottom: 20px;
        }

        .sub-title {
            font-size: 48px;
            font-weight: 700;
            color: #0066ff;
            line-height: 1.3;
            margin-bottom: 40px;
        }

        .description {
            font-size: 16px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 60px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-bottom: 60px;
        }

        .feature-card {
            background: #f8f9fb;
            padding: 24px;
            border-radius: 12px;
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .feature-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .feature-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .footer-links {
            display: flex;
            gap: 30px;
        }

        .footer-link {
            color: #0066ff;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .footer-link::before {
            content: '●';
            font-size: 8px;
        }

        /* 右侧登录区域 */
        .right-section {
            flex: 1;
            background: linear-gradient(180deg, #e8f2ff 0%, #f5f7fa 100%);
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 顶部装饰条 */
        .top-decoration {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #0066ff 0%, #00d4ff 100%);
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin-top: 40px;
            max-width: 480px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .login-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 40px;
        }

        .login-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #0066ff 0%, #00a3ff 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: 700;
        }

        .login-title-group h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .login-title-group p {
            font-size: 14px;
            color: #999;
        }

        .workspace-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .workspace-name {
            font-size: 16px;
            color: #1a1a1a;
            font-weight: 600;
            margin-bottom: 30px;
        }

        /* 表单 */
        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 18px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background: #ffffff;
            color: #1a1a1a;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0066ff;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
        }

        .form-group input::placeholder {
            color: #ccc;
        }

        .captcha-group {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .captcha-group input {
            flex: 1;
        }

        .captcha-code {
            padding: 14px 20px;
            background: #f0f0f0;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            color: #666;
            letter-spacing: 4px;
            user-select: none;
            cursor: pointer;
        }

        .remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .remember-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember-checkbox input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .remember-checkbox label {
            font-size: 14px;
            color: #666;
            cursor: pointer;
            margin: 0;
        }

        .forgot-link {
            color: #0066ff;
            text-decoration: none;
            font-size: 14px;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* 按钮 */
        .login-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0066ff 0%, #00a3ff 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 102, 255, 0.3);
        }

        .login-button:active {
            transform: translateY(0);
        }

        .login-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-button.loading .button-text {
            display: none;
        }

        .login-button.loading .spinner {
            display: block;
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #666;
        }

        .register-link a {
            color: #0066ff;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* 错误消息 */
        .error-message {
            background: #fff3f3;
            color: #ff4444;
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #ff4444;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .left-section {
                display: none;
            }
            
            .right-section {
                width: 100%;
            }
        }

        @media (max-width: 640px) {
            .right-section {
                padding: 30px 20px;
            }

            .login-card {
                padding: 30px 20px;
            }

            .main-title, .sub-title {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧内容区域 -->
        <div class="left-section">
            <div class="logo">
                <div class="logo-dot"></div>
                <span class="logo-text">多模态图像融合系统</span>
            </div>

            <div class="content">
                <h1 class="main-title">基于多模态图像融合的三维重建与智能感知</h1>
                <h2 class="sub-title">一体化系统平台</h2>
                
                <p class="description">
                    面向工业现场的一体化平台，支持多模态数据融合、三维重建、实时建模、<br>
                    运行监测与智能感知数据分析。
                </p>

                <div class="features">
                    <div class="feature-card">
                        <div class="feature-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="#0066ff">
                                <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                            </svg>
                        </div>
                        <div class="feature-title">一体化业务流程</div>
                        <div class="feature-desc">覆盖数据接入、图像融合、三维重建、智能感知与运行监测。</div>
                    </div>
                    <div class="feature-card">
                        <div class="feature-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="#0066ff">
                                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
                            </svg>
                        </div>
                        <div class="feature-title">安全接入与权限控制</div>
                        <div class="feature-desc">提供统一身份认证、角色权限控制与多租户数据安全管理。</div>
                    </div>
                </div>
            </div>

            <div class="footer-links">
                <a href="#" class="footer-link">产品介绍</a>
                <a href="#" class="footer-link">云计算服务</a>
                <a href="#" class="footer-link">学习资料分析</a>
            </div>
        </div>

        <!-- 右侧登录区域 -->
        <div class="right-section">
            <div class="top-decoration"></div>
            
            <div class="login-card">
                <div class="login-header">
                    <div class="login-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
                            <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/>
                        </svg>
                    </div>
                    <div class="login-title-group">
                        <h2>欢迎登录</h2>
                        <p>统一身份认证与安全登录</p>
                    </div>
                </div>

                <div class="workspace-label">WORKSPACE</div>
                <div class="workspace-name">多模态图像融合与三维重建系统</div>

                <div id="errorMessage" class="error-message"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">用户名/电子邮箱</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                                </svg>
                            </span>
                            <input type="text" id="username" name="username" required autocomplete="username" placeholder="admin">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="password">密码</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                                </svg>
                            </span>
                            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="captcha">验证码</label>
                        <div class="captcha-group">
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
                                    </svg>
                                </span>
                                <input type="text" id="captcha" name="captcha" placeholder="请输入验证码">
                            </div>
                            <div class="captcha-code" id="captchaCode">VJ7D</div>
                        </div>
                    </div>

                    <div class="remember-row">
                        <div class="remember-checkbox">
                            <input type="checkbox" id="remember" name="remember">
                            <label for="remember">记住密码</label>
                        </div>
                        <a href="/forgot-password.html" class="forgot-link">忘记密码?</a>
                    </div>

                    <button type="submit" class="login-button" id="loginBtn">
                        <span class="button-text">登录系统</span>
                        <div class="spinner"></div>
                    </button>
                </form>

                <div class="register-link">
                    还没有账号？<a href="/register.html">立即注册</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 生成随机验证码
        function generateCaptcha() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let captcha = '';
            for (let i = 0; i < 4; i++) {
                captcha += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return captcha;
        }

        let currentCaptcha = generateCaptcha();
        const captchaCode = document.getElementById('captchaCode');
        captchaCode.textContent = currentCaptcha;

        // 点击验证码刷新
        captchaCode.addEventListener('click', () => {
            currentCaptcha = generateCaptcha();
            captchaCode.textContent = currentCaptcha;
        });

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // 隐藏之前的消息
            errorMessage.classList.remove('show');

            // 获取表单数据
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const captcha = document.getElementById('captcha').value;

            // 验证验证码
            if (captcha.toUpperCase() !== currentCaptcha) {
                errorMessage.textContent = '验证码错误，请重新输入';
                errorMessage.classList.add('show');
                currentCaptcha = generateCaptcha();
                captchaCode.textContent = currentCaptcha;
                document.getElementById('captcha').value = '';
                return;
            }

            // 禁用按钮并显示加载状态
            loginBtn.disabled = true;
            loginBtn.classList.add('loading');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    // 登录成功
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));

                    // 跳转到Dashboard工作台
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 500);
                } else {
                    // 登录失败
                    errorMessage.textContent = data.message || data.detail || '登录失败';
                    errorMessage.classList.add('show');
                    // 刷新验证码
                    currentCaptcha = generateCaptcha();
                    captchaCode.textContent = currentCaptcha;
                    document.getElementById('captcha').value = '';
                }
            } catch (error) {
                errorMessage.textContent = '网络错误，请检查服务器是否正在运行。';
                errorMessage.classList.add('show');
                console.error('Login error:', error);
                // 刷新验证码
                currentCaptcha = generateCaptcha();
                captchaCode.textContent = currentCaptcha;
                document.getElementById('captcha').value = '';
            } finally {
                // 恢复按钮
                loginBtn.disabled = false;
                loginBtn.classList.remove('loading');
            }
        });

        // 检查是否已登录
        const token = localStorage.getItem('token');
        if (token) {
            fetch('/api/auth/profile', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    localStorage.removeItem('token');
                    localStorage.removeItem('user');
                }
            })
            .then(data => {
                if (data && data.data) {
                    // 已登录，跳转到Dashboard
                    window.location.href = '/';
                }
            })
            .catch(error => {
                console.error('Token verification failed:', error);
            });
        }
    </script>
</body>
</html>
