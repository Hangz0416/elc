<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘记密码 - 基于多模态图像融合的三维重建与智能感知一体化系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Microsoft YaHei', sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
        }

        .container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* 左侧内容区域 */
        .left-section {
            flex: 0 0 55%;
            padding: 60px 80px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #ffffff;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 80px;
        }

        .logo-dot {
            width: 8px;
            height: 8px;
            background: #0066ff;
            border-radius: 50%;
        }

        .logo-text {
            font-size: 16px;
            color: #666;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .main-title {
            font-size: 48px;
            font-weight: 700;
            color: #1a1a1a;
            line-height: 1.3;
            margin-bottom: 20px;
        }

        .sub-title {
            font-size: 48px;
            font-weight: 700;
            color: #0066ff;
            line-height: 1.3;
            margin-bottom: 40px;
        }

        .description {
            font-size: 16px;
            color: #666;
            line-height: 1.8;
            margin-bottom: 60px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
            margin-bottom: 60px;
        }

        .feature-card {
            background: #f8f9fb;
            padding: 24px;
            border-radius: 12px;
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .feature-title {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .feature-desc {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
        }

        .footer-links {
            display: flex;
            gap: 30px;
        }

        .footer-link {
            color: #0066ff;
            text-decoration: none;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .footer-link::before {
            content: '●';
            font-size: 8px;
        }

        /* 右侧重置密码区域 */
        .right-section {
            flex: 1;
            background: linear-gradient(180deg, #e8f2ff 0%, #f5f7fa 100%);
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* 顶部装饰条 */
        .top-decoration {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #0066ff 0%, #00d4ff 100%);
        }

        .reset-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            margin-top: 40px;
            max-width: 480px;
            width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .reset-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 40px;
        }

        .reset-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #0066ff 0%, #00a3ff 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: 700;
        }

        .reset-title-group h2 {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
        }

        .reset-title-group p {
            font-size: 14px;
            color: #999;
        }

        .workspace-label {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .workspace-name {
            font-size: 16px;
            color: #1a1a1a;
            font-weight: 600;
            margin-bottom: 30px;
        }

        /* 步骤指示器 */
        .steps {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
            position: relative;
        }

        .steps::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            height: 2px;
            background: #e0e0e0;
            z-index: 0;
        }

        .step {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            position: relative;
            z-index: 1;
        }

        .step-number {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #e0e0e0;
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        .step.active .step-number {
            background: #0066ff;
            color: white;
        }

        .step.completed .step-number {
            background: #10b981;
            color: white;
        }

        .step-label {
            font-size: 12px;
            color: #999;
        }

        .step.active .step-label {
            color: #0066ff;
            font-weight: 600;
        }

        /* 表单 */
        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            font-size: 18px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px 14px 44px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: all 0.3s;
            background: #ffffff;
            color: #1a1a1a;
        }

        .form-group input:focus {
            outline: none;
            border-color: #0066ff;
            box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
        }

        .form-group input::placeholder {
            color: #ccc;
        }

        /* 按钮 */
        .reset-button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0066ff 0%, #00a3ff 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .reset-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 102, 255, 0.3);
        }

        .reset-button:active {
            transform: translateY(0);
        }

        .reset-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .reset-button.loading .button-text {
            display: none;
        }

        .reset-button.loading .spinner {
            display: block;
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #666;
        }

        .back-link a {
            color: #0066ff;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        /* 消息 */
        .message {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message {
            background: #fff3f3;
            color: #ff4444;
            border-left: 4px solid #ff4444;
        }

        .success-message {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .info-message {
            background: #e8f2ff;
            color: #0066ff;
            border-left: 4px solid #0066ff;
        }

        .message.show {
            display: block;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }

        .step-content {
            display: none;
        }

        .step-content.active {
            display: block;
        }

        /* 响应式设计 */
        @media (max-width: 1024px) {
            .left-section {
                display: none;
            }
            
            .right-section {
                width: 100%;
            }
        }

        @media (max-width: 640px) {
            .right-section {
                padding: 30px 20px;
            }

            .reset-card {
                padding: 30px 20px;
            }

            .main-title, .sub-title {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧内容区域 -->
        <div class="left-section">
            <div class="logo">
                <div class="logo-dot"></div>
                <span class="logo-text">多模态图像融合系统</span>
            </div>

            <div class="content">
                <h1 class="main-title">基于多模态图像融合的三维重建与智能感知</h1>
                <h2 class="sub-title">一体化系统平台</h2>
                
                <p class="description">
                    面向工业现场的一体化平台，支持多模态数据融合、三维重建、实时建模、<br>
                    运行监测与智能感知数据分析。
                </p>

                <div class="features">
                    <div class="feature-card">
                        <div class="feature-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="#0066ff">
                                <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6 0 1.01-.25 1.97-.7 2.8l1.46 1.46C19.54 15.03 20 13.57 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6 0-1.01.25-1.97.7-2.8L5.24 7.74C4.46 8.97 4 10.43 4 12c0 4.42 3.58 8 8 8v3l4-4-4-4v3z"/>
                            </svg>
                        </div>
                        <div class="feature-title">一体化业务流程</div>
                        <div class="feature-desc">覆盖数据接入、图像融合、三维重建、智能感知与运行监测。</div>
                    </div>
                    <div class="feature-card">
                        <div class="feature-icon">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="#0066ff">
                                <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
                            </svg>
                        </div>
                        <div class="feature-title">安全接入与权限控制</div>
                        <div class="feature-desc">提供统一身份认证、角色权限控制与多租户数据安全管理。</div>
                    </div>
                </div>
            </div>

            <div class="footer-links">
                <a href="#" class="footer-link">产品介绍</a>
                <a href="#" class="footer-link">云计算服务</a>
                <a href="#" class="footer-link">学习资料分析</a>
            </div>
        </div>

        <!-- 右侧重置密码区域 -->
        <div class="right-section">
            <div class="top-decoration"></div>
            
            <div class="reset-card">
                <div class="reset-header">
                    <div class="reset-icon">
                        <svg width="28" height="28" viewBox="0 0 24 24" fill="white">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                    </div>
                    <div class="reset-title-group">
                        <h2>重置密码</h2>
                        <p>请按照步骤重置您的密码</p>
                    </div>
                </div>

                <div class="workspace-label">WORKSPACE</div>
                <div class="workspace-name">多模态图像融合与三维重建系统</div>

                <!-- 步骤指示器 -->
                <div class="steps">
                    <div class="step active" id="step1Indicator">
                        <div class="step-number">1</div>
                        <div class="step-label">验证身份</div>
                    </div>
                    <div class="step" id="step2Indicator">
                        <div class="step-number">2</div>
                        <div class="step-label">设置新密码</div>
                    </div>
                    <div class="step" id="step3Indicator">
                        <div class="step-number">3</div>
                        <div class="step-label">完成</div>
                    </div>
                </div>

                <div id="errorMessage" class="message error-message"></div>
                <div id="successMessage" class="message success-message"></div>
                <div id="infoMessage" class="message info-message"></div>

                <!-- 步骤1: 验证用户名 -->
                <div class="step-content active" id="step1Content">
                    <form id="verifyForm">
                        <div class="form-group">
                            <label for="username">用户名</label>
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                                    </svg>
                                </span>
                                <input type="text" id="username" name="username" required placeholder="请输入您的用户名">
                            </div>
                        </div>

                        <button type="submit" class="reset-button" id="verifyBtn">
                            <span class="button-text">下一步</span>
                            <div class="spinner"></div>
                        </button>
                    </form>
                </div>

                <!-- 步骤2: 设置新密码 -->
                <div class="step-content" id="step2Content">
                    <form id="resetForm">
                        <div class="form-group">
                            <label for="newPassword">新密码</label>
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                                    </svg>
                                </span>
                                <input type="password" id="newPassword" name="newPassword" required minlength="8" placeholder="请输入新密码（至少8位）">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="confirmPassword">确认新密码</label>
                            <div class="input-wrapper">
                                <span class="input-icon">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
                                    </svg>
                                </span>
                                <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="请再次输入新密码">
                            </div>
                        </div>

                        <button type="submit" class="reset-button" id="resetBtn">
                            <span class="button-text">重置密码</span>
                            <div class="spinner"></div>
                        </button>
                    </form>
                </div>

                <!-- 步骤3: 完成 -->
                <div class="step-content" id="step3Content">
                    <div style="text-align: center; padding: 40px 20px;">
                        <div style="font-size: 64px; margin-bottom: 20px;">✓</div>
                        <h3 style="font-size: 20px; color: #10b981; margin-bottom: 12px;">密码重置成功！</h3>
                        <p style="color: #666; margin-bottom: 30px;">您的密码已成功重置，请使用新密码登录。</p>
                        <button class="reset-button" onclick="window.location.href='/login.html'">
                            <span class="button-text">返回登录</span>
                        </button>
                    </div>
                </div>

                <div class="back-link">
                    <a href="/login.html">← 返回登录</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentStep = 1;
        let verifiedUsername = '';

        // 步骤1: 验证用户名
        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            hideMessages();

            const username = document.getElementById('username').value;
            const verifyBtn = document.getElementById('verifyBtn');

            verifyBtn.disabled = true;
            verifyBtn.classList.add('loading');

            try {
                const response = await fetch('/api/auth/verify-username', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username })
                });

                const data = await response.json();

                if (response.ok) {
                    verifiedUsername = username;
                    showMessage('用户验证成功，请设置新密码', 'info');
                    goToStep(2);
                } else {
                    showMessage(data.message || data.detail || '用户名不存在', 'error');
                }
            } catch (error) {
                showMessage('网络错误，请检查服务器是否正在运行', 'error');
                console.error('Verify error:', error);
            } finally {
                verifyBtn.disabled = false;
                verifyBtn.classList.remove('loading');
            }
        });

        // 步骤2: 重置密码
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            hideMessages();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 8) {
                showMessage('密码长度至少为8位', 'error');
                return;
            }

            if (!/[a-zA-Z]/.test(newPassword) || !/\d/.test(newPassword)) {
                showMessage('密码必须包含字母和数字', 'error');
                return;
            }

            if (newPassword !== confirmPassword) {
                showMessage('两次输入的密码不一致', 'error');
                return;
            }

            const resetBtn = document.getElementById('resetBtn');
            resetBtn.disabled = true;
            resetBtn.classList.add('loading');

            try {
                const response = await fetch('/api/auth/reset-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: verifiedUsername,
                        new_password: newPassword
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    goToStep(3);
                } else {
                    showMessage(data.message || data.detail || '密码重置失败', 'error');
                }
            } catch (error) {
                showMessage('网络错误，请检查服务器是否正在运行', 'error');
                console.error('Reset error:', error);
            } finally {
                resetBtn.disabled = false;
                resetBtn.classList.remove('loading');
            }
        });

        function goToStep(step) {
            // 隐藏所有步骤内容
            document.querySelectorAll('.step-content').forEach(content => {
                content.classList.remove('active');
            });

            // 显示当前步骤内容
            document.getElementById(`step${step}Content`).classList.add('active');

            // 更新步骤指示器
            for (let i = 1; i <= 3; i++) {
                const indicator = document.getElementById(`step${i}Indicator`);
                indicator.classList.remove('active', 'completed');
                
                if (i < step) {
                    indicator.classList.add('completed');
                } else if (i === step) {
                    indicator.classList.add('active');
                }
            }

            currentStep = step;
        }

        function showMessage(message, type) {
            hideMessages();
            const messageEl = document.getElementById(`${type}Message`);
            messageEl.textContent = message;
            messageEl.classList.add('show');
        }

        function hideMessages() {
            document.querySelectorAll('.message').forEach(msg => {
                msg.classList.remove('show');
            });
        }
    </script>
</body>
</html>
